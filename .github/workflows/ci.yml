name: CI

on:
  # Only `main` on push: every other branch is covered by the pull_request
  # trigger, and listing "**" here queued two full runs of this job (build +
  # Playwright + a browser download) for every push to a PR branch, doubling
  # the Actions minutes this private repo burns.
  push:
    branches: ["main"]
  pull_request:

# One run per branch/PR. A new push cancels the run still in flight for the
# same ref instead of leaving it to compete for a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The job normally finishes in ~2 minutes; this caps a hung step rather
    # than letting it run to the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:content
      - run: npm test
      # NEXT_PUBLIC_APP_URL is deliberately NOT set here: this is a compile
      # check, not a deployment, so the Z2 launch checks (lib/launchChecks.ts)
      # stay inert. The real deployment build does set it and will fail if the
      # medical reviewer is still a placeholder.
      - run: npm run build
      # E2E runs against the production build above — the service worker is
      # disabled in `next dev`, so offline coverage needs `next start`.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
