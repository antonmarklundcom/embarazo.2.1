name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # NEXT_PUBLIC_APP_URL is deliberately NOT set here: this is a compile
      # check, not a deployment, so the Z2 launch checks (lib/launchChecks.ts)
      # stay inert. The real deployment build does set it and will fail if the
      # medical reviewer is still a placeholder.
      - run: npm run build
      # E2E runs against the production build above — the service worker is
      # disabled in `next dev`, so offline coverage needs `next start`.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
