# K13a (docs/archive/FABLE-PLAN-2026-08.md §6). The Next.js 15.1.6 → 15.5.x bump in
# this PR was found by hand, months late. Dependabot is here so the next one
# is found by a robot instead.
#
# Deliberately monthly, not weekly, and grouped: this repo's CI is
# label-gated (K21) and its Actions minutes are budgeted, so a Dependabot PR
# costs nothing until a human applies `run-ci`. Monthly + grouped keeps the
# review surface to roughly one PR per ecosystem per month.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      # Security fixes arrive on their own, promptly, ungrouped by severity.
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    # 2026-10-17: these majors are blocked and kept arriving bundled with safe
    # updates (PR136/137, PR148/149), which made every group PR unmergeable.
    # Next 16 and eslint-config-next 16 wait on next-auth v5 leaving beta;
    # ESLint 10 waits on the same; TypeScript 7 waits on typescript-eslint;
    # Vitest 5 and @types/node above Node 22 need their own migration. Remove
    # an entry when its blocker is gone (docs/LAUNCH-READINESS-2026-10-16.md).
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
